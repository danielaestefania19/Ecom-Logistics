# These functions validate the caller's JWT themselves (see each index.ts).
[functions.asana-orders]
verify_jwt = false

[functions.admin-invite-user]
verify_jwt = false

[functions.stripe-invoices]
verify_jwt = true

# Accepts user JWTs and the service-role key (internal calls); checks access itself.
[functions.asana-sync]
verify_jwt = false

[functions.tracking-register]
verify_jwt = true

# Amazon SP-API connection flow. Start/disconnect resolve the caller themselves (see _shared/auth.ts).
[functions.amazon-oauth-start]
verify_jwt = true

[functions.amazon-disconnect]
verify_jwt = true

# Browser redirect from Seller Central; authenticated by the one-shot `state` nonce.
[functions.amazon-oauth-callback]
verify_jwt = false

# Called manually from the portal or by cron; auth by JWT or service-role key.
[functions.amazon-sync]
verify_jwt = false

# FBA Inbound wizard steps; staff/admin only (checked inside the function).
[functions.amazon-inbound]
verify_jwt = true

# Called by EasyPost; authenticated by HMAC signature.
[functions.tracking-webhook]
verify_jwt = false
